name: Finance V3 Phase B validation

on:
  push:
    branches:
      - feat/finance-v3-read-agent
  workflow_dispatch:

jobs:
  phase-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full repository checks
        run: npm run check
      - name: Finance V3 real Workers AI benchmark
        run: npm run benchmark:finance-v3
